<style>
/* 本文件引用到的 token(值同 assets/design-tokens.css 浅色) */
:root{--RD1:4px;--RD6:24px;--SP0:0px;--SP1:4px;--SP2:8px;--SP7:32px;}
</style>
<style>
/* 本文件引用到的颜色 token(值同 assets/design-tokens.css 浅色) */
:root{--CL2:#EEEEEE;--CT1:#0F0F1B;--CT3:#55555E;--CT6:#FFFFFF;--H9:#0F0F1B;}
</style>
<style>
/* ---- 组件本体(750 基准)---- */
.gj-bottomnav{width:100%;background:var(--CB1,#fff);border-top:1px solid var(--CL2,#EEEEEE);box-sizing:border-box}
.gj-bn-row{display:flex;width:100%}
.gj-bn-home{height:68px}
.gj-bn-item{flex:1;height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--SP1);color:var(--CT3,#55555E);text-decoration:none;cursor:pointer}
.gj-bn-item.is-active{color:var(--CP0,#F93838)}
.gj-bn-ico{display:block;width:48px;height:48px}
.gj-bn-ico svg{width:48px;height:48px}
/* 两态切换:选择器带 .gj-bn-ico 前缀(特异性高于 .gj-bn-ico svg),否则 svg 的 display 会盖掉 display:none */
.gj-bn-ico .gj-bn-ico-active{display:none}
.gj-bn-ico .gj-bn-ico-inactive{display:block}
.gj-bn-item.is-active .gj-bn-ico-active{display:block}
.gj-bn-item.is-active .gj-bn-ico-inactive{display:none}
.gj-bn-label{font-size:24px;font-weight:400;line-height:1}
/* ---- 演示脚手架(非组件,仅本预览页用)---- */
.gj-bn-doc{width:750px;font-family:var(--font-sans,"PingFang SC"),system-ui,sans-serif;color:var(--CT1)}
.gj-bn-demo{margin:var(--SP0) var(--SP0) var(--SP7)}
.gj-bn-vlabel{font-size:13px;font-weight:600;color:var(--CT3);margin:var(--SP0) var(--SP0) var(--SP2);display:flex;gap:var(--SP2);align-items:center}
.gj-bn-vlabel .n{font-size:11px;font-weight:700;color:var(--CT6);background:var(--H9);border-radius:var(--RD1);padding:0 var(--SP2)}
.gj-bn-frame{border:1px solid var(--CL2);border-radius:var(--RD6);overflow:hidden}
</style>
<script>
/* 每个底导实例内部:点击 tab 切换选中(仅在本 row 内互斥) */
(function(){
  document.querySelectorAll('.gj-bottomnav .gj-bn-row').forEach(function(row){
    row.querySelectorAll('.gj-bn-item').forEach(function(item){
      item.addEventListener('click', function(e){
        e.preventDefault();
        row.querySelectorAll('.gj-bn-item').forEach(function(i){ i.classList.remove('is-active'); });
        item.classList.add('is-active');
      });
    });
  });
})();
</script>
