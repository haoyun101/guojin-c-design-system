.iconfont{font-family:"iconfont"!important;font-style:normal;-webkit-font-smoothing:antialiased;line-height:1}
.icon-zixuanzijin:before{content:"\e610"}
.icon-zixuanzixun:before{content:"\e614"}
.icon-shixinjiantou-you:before{content:"\e628"}
:root{
  /* SP/RD · 750px */
  --SP0:0px; --SP1:4px; --SP2:8px; --SP3:12px; --SP4:16px; --SP5:20px; --SP6:24px; --SP7:32px; --SP8:40px; --SP9:60px; --SP10:80px; --RD0:0px; --RD1:4px; --RD2:8px; --RD3:12px; --RD4:16px; --RD5:20px; --RD6:24px; --RD7:32px; --RD8:40px; --RD9:999px; --RD10:6px;


  --cb10:rgba(249,56,56,.05);--cb11:rgba(5,176,99,.05);--cb12:rgba(85,85,94,.05);
  --ct1:var(--H9);--ci4:var(--H6);--cs1:var(--R6);--cs2:var(--G6);--cs3:var(--H8);
  
  --pf:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --num:"GJType","D-DIN","DIN Alternate",ui-monospace,monospace;
}
*{box-sizing:border-box}
/* 行情/指数行情卡片 · 组合 750×178 · top24/bottom20/左右24 · gap16
   构成:横排 N 个「行情卡片」(通用 C15,此处 .card)实例 + 资金资讯入口区 + 组合右缘箭头
   单卡(.card)= C15 行情卡片,宽度随容器自适应(扣资金资讯/间距后按卡数均分;自选页 750 容器 3 卡 → 170,非固定);资金资讯卡 144×134 无底色;箭头 CI4 弱图标 */
.idx{position:relative;height:178px;width:750px;background:var(--CB1);display:flex;align-items:flex-start;gap:var(--SP4);padding:var(--SP6) var(--SP6) var(--SP5);font-family:var(--pf)}
.card{flex:1 1 0;min-width:0;height:134px;border-radius:var(--RD4);position:relative}
.card .nm{position:absolute;left:0;right:0;top:12px;text-align:center;font-weight:400;font-size:28px;line-height:42px;color:var(--ct1);white-space:nowrap}
.card .val{position:absolute;left:0;right:0;top:58px;text-align:center;font-family:var(--num);font-weight:500;font-size:36px;line-height:36px;white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.card .chg{position:absolute;left:50%;transform:translateX(-50%);top:98px;font-family:var(--num);font-weight:400;font-size:24px;line-height:24px;display:flex;gap:var(--SP4);white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.up{color:var(--cs1)}.down{color:var(--cs2)}.flat{color:var(--cs3)}
.c-red{background:var(--cb10)}.c-green{background:var(--cb11)}.c-grey{background:var(--cb12)}
/* 资金/资讯入口卡:宽144 无底色;图标48@(8,24)/(76,24),文字24@y76 */
.fund{flex:none;width:144px;height:134px;position:relative}
.fund .ic{position:absolute;top:24px;width:48px;height:48px;font-size:48px;color:var(--ct1);display:flex;align-items:center;justify-content:center}
.fund .ic.zj{left:8px}.fund .ic.zx{left:76px}
.fund .lb{position:absolute;top:76px;font-size:24px;line-height:1;color:var(--ct1)}
.fund .lb.zj{left:8px}.fund .lb.zx{left:76px}
/* 组合右缘箭头:CI4 弱图标 #cccccc,指示横滑/更多 */
.arrow{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--ci4)}
body{margin:var(--SP0);background:var(--CB2)}
.demo{width:750px;margin:var(--SP5) auto;background:var(--CB1);border-radius:var(--RD3);overflow:hidden;box-shadow:0 4px 16px rgba(20,24,40,.06)}
</style><style>
/* 本文件引用到的颜色 token(值同 assets/design-tokens.css 浅色) */
:root{--CB1:#FFFFFF;--G6:#05B063;--H6:#CCCCCC;--H8:#55555E;--H9:#0F0F1B;--R6:#F93838;}
</style>
<style>
/* 本文件引用到的 token(值同 assets/design-tokens.css 浅色) */
:root{--CB2:#F2F4F8;}
</style>
</head>
<body>
<div class="demo">
  <div class="idx">
    <div class="card c-red">
      <div class="nm">标题名称</div>
      <div class="val up">0000.00</div>
      <div class="chg up"><span>+00.00</span><span>+0.00%</span></div>
    </div>
    <div class="card c-green">
      <div class="nm">标题名称</div>
      <div class="val down">0000.00</div>
      <div class="chg down"><span>-00.00</span><span>-0.00%</span></div>
    </div>
    <div class="card c-grey">
      <div class="nm">标题名称</div>
      <div class="val flat">0000.00</div>
      <div class="chg flat"><span>0.00</span><span>0.00%</span></div>
    </div>
    <div class="fund">
      <span class="ic zj iconfont icon-zixuanzijin"></span>
      <span class="ic zx iconfont icon-zixuanzixun"></span>
      <span class="lb zj">资金</span>
      <span class="lb zx">资讯</span>
    </div>
    <span class="arrow iconfont icon-shixinjiantou-you"></span>
  </div>
</div>
</body></html>
